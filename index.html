<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our online courses</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="courses">
    <img class="courses__decor courses__decor--dots" src="assets/img/dots.svg" alt="" aria-hidden="true">
    <img class="courses__decor courses__decor--shapes" src="assets/img/shapes.svg" alt="" aria-hidden="true">
    <img class="courses__decor courses__decor--arrow" src="assets/img/shapes-strel.svg" alt="" aria-hidden="true">

    <div class="courses__inner">
      <header class="courses__intro">
        <p class="courses__subtitle">Enjoy your studying!</p>
        <h1 class="courses__title">Our online courses</h1>
      </header>

    <div class="courses__toolbar">
      <ul class="filters" data-filters></ul>

      <form class="search" data-search role="search" autocomplete="off">
        <input
          class="search__input"
          type="text"
          name="search"
          placeholder="Search course..."
          data-search-input
          aria-label="Search course">
        <button class="search__button" type="submit" aria-label="Search">
          <img class="search__icon" src="assets/img/search.svg" alt="" width="16" height="16">
        </button>
      </form>
    </div>

    <ul class="courses__grid" data-grid></ul>

    <p class="courses__empty" data-empty hidden>No courses found.</p>

    <div class="load-more" data-load-more-wrap>
      <button class="load-more__button" type="button" data-load-more>
        <img class="load-more__icon" src="assets/img/Convert.svg" alt="" width="20" height="20">
        <span>Load more</span>
      </button>
    </div>
    </div>
  </main>

  <script src="js/courses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
